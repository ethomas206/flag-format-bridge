[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagconv"
version = "0.1.0"
description = "Convert feature flag definitions between LaunchDarkly-style and flat JSON formats"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ethomas206"}]

[project.scripts]
flagconv = "flagconv.cli:main"

[tool.setuptools.packages.find]
include = ["flagconv*"]
